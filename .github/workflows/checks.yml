# Live checks. The development sandbox cannot reach shops, so every live check
# is described in checks/request.yml and runs here. Results are committed to
# checks/results/<id>/ on the same branch.
#
# Started by hand only (D-051): `Run workflow` on the branch, or
# `gh workflow run checks.yml --ref <branch>`. Pushing checks/request.yml starts
# nothing, so a fast-forward of main never starts a second run (INC-010).
name: checks

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    # recon-005 reads about 300 stores at the recon pace (about 3 hours).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # Fast-forwarding main carries a request already checked on a branch: run each
      # request once, never twice at the same stores (INC-010).
      - name: Skip a request that already ran or is running
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          id="$(sed -n 's/^id:[[:space:]]*//p' checks/request.yml)"
          if [ -n "$(ls -A "checks/results/$id" 2>/dev/null)" ]; then
            echo "results for $id are already committed; not running it again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mine="$(git hash-object checks/request.yml)"
          for status in requested queued pending waiting in_progress; do
            for sha in $(gh api "repos/$REPO/actions/workflows/checks.yml/runs?status=$status&per_page=50" \
                --jq ".workflow_runs[] | select(.id < $RUN_ID) | .head_sha"); do
              theirs="$(gh api "repos/$REPO/contents/checks/request.yml?ref=$sha" --jq .sha)"
              if [ "$theirs" = "$mine" ]; then
                echo "an earlier checks run is already reading $id (commit $sha); not running it twice"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.dup.outputs.skip == 'false'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        if: steps.dup.outputs.skip == 'false'
        run: uv sync --locked --no-dev

      - name: Run check
        if: steps.dup.outputs.skip == 'false'
        run: uv run --no-dev python -m pricemon.checks checks/request.yml

      - name: Commit results
        if: always() && steps.dup.outputs.skip == 'false'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          id="$(sed -n 's/^id:[[:space:]]*//p' checks/request.yml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks/results
          if git diff --cached --quiet; then
            echo "no results to commit"
            exit 0
          fi
          git commit -m "checks: results for ${id}"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          exit 1
