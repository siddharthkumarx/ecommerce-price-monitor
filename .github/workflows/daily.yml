# Daily price, discount and stock run. Schedules run on the default branch.
# Keep the cron lines identical to CRONS in src/pricemon/schedule.py (tested).
name: daily
run-name: ${{ inputs.slot && format('daily, slot {0}', inputs.slot) || format('daily, {0}', github.event_name) }}

on:
  schedule:
    # One run a day (D-013). The Black Friday extra runs of 26-27 Nov 2026 ended when
    # the owner lifted the freeze on 27 Nov 2026 (D-031).
    - cron: "17 6 * * *"
  # GitHub starts the schedule above hours late (INC-009), so an external trigger
  # (the owner's own cron, fixed body `slot: auto`, D-030, D-035) dispatches each slot on time; the
  # late schedule event then finds the slot filled and skips. Without `slot`, a
  # manual run always runs.
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot this run fills, UTC (e.g. 2026-11-26T06:17Z); auto = the active slot within 10 minutes of now, else skip; empty = manual run; check = test the trigger only"
        required: false
        type: string
        default: ""
      by:
        description: "Who dispatched the slot: empty = the on-time trigger; watchdog = the watchdog"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  # The process job downloads the shard files of its own run (gh run download).
  actions: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # Decides whether this trigger runs the pipeline (pricemon.schedule gate). A manual
  # run always does. A dispatch that names its slot (the external on-time trigger or
  # the watchdog) and a scheduled run both run only if the slot is not filled yet:
  # GitHub starts scheduled slots hours late (INC-006, INC-007, INC-009), after the
  # on-time dispatch filled them.
  slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run: ${{ steps.decide.outputs.run }}
      slot: ${{ steps.decide.outputs.slot }}
      run_at: ${{ steps.decide.outputs.run_at }}
      shards: ${{ steps.plan.outputs.shards }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            config/stores.yml
            data/runs.jsonl
            src/pricemon
          sparse-checkout-cone-mode: false

      - name: Plan the shards
        id: plan
        run: |
          # Every shard reads the store list of this commit, even if the branch moves
          # while the run is going (D-033).
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # One shard per 60 stores (D-033, D-036); four if the plan itself fails.
          if PYTHONPATH=src python3 -m pricemon.schedule shards --stores config/stores.yml > plan.txt; then
            cat plan.txt
            grep '^shards=' plan.txt >> "$GITHUB_OUTPUT"
          else
            echo "shards=[1,2,3,4]" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
        run: |
          # Fails open: if the gate itself fails, the pipeline runs (except for a
          # trigger check, which never runs it).
          if ! PYTHONPATH=src python3 -m pricemon.schedule gate --event "$EVENT" \
            --cron "$SCHEDULE" --slot "$SLOT" --runs data/runs.jsonl > gate.txt; then
            if [ "$SLOT" = "check" ]; then echo "run=false" > gate.txt; else echo "run=true" > gate.txt; fi
            echo "reason=gate failed" >> gate.txt
          fi
          cat gate.txt
          wait_s="$(sed -n 's/^wait_s=//p' gate.txt)"
          if grep -qx "run=true" gate.txt && [ "${wait_s:-0}" -gt 0 ]; then
            echo "waiting ${wait_s}s for the slot"
            sleep "$wait_s"
          fi
          grep -E '^(run|slot|reason)=' gate.txt >> "$GITHUB_OUTPUT"
          # The run's start time, shared by its shards and the process job (D-033).
          echo "run_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "### $(sed -n 's/^reason=//p' gate.txt)" >> "$GITHUB_STEP_SUMMARY"

  # Reads the stores in shards, ONE AFTER ANOTHER (max-parallel: 1): the run-wide
  # request rate stays that of a single runner and requests are never spread over
  # several IPs at once (D-020, D-033). Each shard is one job under 45 minutes with a
  # 38-minute request budget; a shard that fails leaves its stores "not updated".
  # The slot job plans the shards: one per 60 listed stores (D-036).
  fetch:
    needs: slot
    if: ${{ !cancelled() && needs.slot.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.slot.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.slot.outputs.sha || github.ref_name }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Earlier shards of this run
        # Their run-wide pace and a halt carry over to this shard (D-033).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/prev
          gh run download "$GITHUB_RUN_ID" --pattern 'fetch-*' --dir work/prev || true
          find work/prev -name 'fetch-*.json' -printf '%p %s bytes\n'

      - name: Read this shard's stores
        timeout-minutes: 41
        env:
          RUN_AT: ${{ needs.slot.outputs.run_at }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          mapfile -t prev < <(find work/prev -name 'fetch-*.json' | sort)
          uv run --no-dev python -m pricemon.run --stores config/stores.yml \
            --shard "$SHARD/$TOTAL" --run-at "$RUN_AT" --fetch-out "work/fetch-$SHARD.json" \
            --edge-from "${prev[@]}" work/prev/none.json

      - name: Keep the shard for the process job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetch-${{ matrix.shard }}
          path: work/fetch-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  run:
    needs: [slot, fetch]
    if: ${{ !cancelled() && needs.slot.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    # Owner limit: every job under 45 minutes (D-020); this one reads no store.
    timeout-minutes: 45
    outputs:
      pages: ${{ steps.pages_artifact.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Download this month's history
        run: |
          month="$(date -u +%Y-%m)"
          echo "MONTH=$month" >> "$GITHUB_ENV"
          echo "TAG=data-$month" >> "$GITHUB_ENV"
          mkdir -p work
          # A month file that exists must be downloaded: merging without it would drop
          # the month's earlier closed versions. A missing file (new month, or a first
          # upload that failed) is fine: the run starts the month file from the snapshot.
          assets="$(gh release view "data-$month" --json assets --jq '.assets[].name' 2> /dev/null || true)"
          if printf '%s\n' "$assets" | grep -qx "price_history_$month.parquet"; then
            gh release download "data-$month" -p "price_history_$month.parquet" -D work
          fi
          ls -la work

      - name: Download the shards
        run: |
          mkdir -p work/shards
          gh run download "$GITHUB_RUN_ID" --pattern 'fetch-*' --dir work/shards || true
          find work/shards -name 'fetch-*.json' -printf '%p %s bytes\n'

      - name: Run pipeline
        id: run
        timeout-minutes: 41
        env:
          # The slot the gate resolved (so `auto` is recorded as the slot it filled).
          DISPATCH_SLOT: ${{ inputs.slot && (needs.slot.outputs.slot || inputs.slot) || '' }}
          DISPATCH_BY: ${{ inputs.by }}
          RUN_AT: ${{ needs.slot.outputs.run_at }}
        run: |
          set +e
          mapfile -t shards < <(find work/shards -name 'fetch-*.json' | sort)
          args=(--stores config/stores.yml --data data --history-out "work/price_history_$MONTH.parquet")
          args+=(--run-at "$RUN_AT" --fetch-in "${shards[@]}" work/shards/none.json)
          if [ -f "work/price_history_$MONTH.parquet" ]; then
            args+=(--history-in "work/price_history_$MONTH.parquet")
          fi
          uv run --no-dev python -m pricemon.run "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code $code"

      - name: Upload history to release
        id: upload
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '2'
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Price data $MONTH" \
              --notes "latest-prices.csv: the newest prices of every product option. price_history_$MONTH.parquet: every price version this month. Both are replaced by every good run; the data dictionary is in the README."
          fi
          cp data/latest/snapshot.csv work/latest-prices.csv
          gh release upload "$TAG" "work/price_history_$MONTH.parquet" work/latest-prices.csv --clobber
          # "Download the data" in the README links to the latest release.
          gh release edit "$TAG" --latest

      - name: Withdraw from earlier months
        # The run rewrites this month only; earlier monthly assets get the same keys,
        # so a store that left (D-036) or is shown by number (D-034) leaves them too.
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '2'
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | while read -r tag; do
            [ "$tag" = "$TAG" ] && continue
            month="${tag#data-}"
            dir="work/earlier/$month"
            mkdir -p "$dir"
            gh release download "$tag" -p "price_history_$month.parquet" -p latest-prices.csv -D "$dir" || continue
            set +e
            uv run --no-dev python -m pricemon.publicdata --stores config/stores.yml \
              --parquet "$dir/price_history_$month.parquet" --csv "$dir/latest-prices.csv"
            code=$?
            set -e
            if [ "$code" = 3 ]; then
              files=()
              for f in "$dir/price_history_$month.parquet" "$dir/latest-prices.csv"; do
                [ -f "$f" ] && files+=("$f")
              done
              gh release upload "$tag" "${files[@]}" --clobber
            fi
          done

      - name: Publish Google Sheet
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '2'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        continue-on-error: true
        run: uv run --no-dev python -m pricemon.sheets --data data

      - name: Build dashboard
        if: always() && steps.run.outputs.code != ''
        run: uv run --no-dev python -m pricemon.site --data data --stores config/stores.yml --out site

      # The README, the dataset card and the data-driven visuals show the latest run.
      - name: Render README and visuals
        if: always() && steps.run.outputs.code != ''
        run: |
          uv run --no-dev python -m pricemon.visuals --data data --stores config/stores.yml --out assets
          uv run --no-dev python -m pricemon.readme

      - name: Keep the dashboard as a run artifact
        if: always() && steps.run.outputs.code != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 14

      - name: Package the dashboard for GitHub Pages
        id: pages_artifact
        if: always() && steps.run.outputs.code != '' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Data is committed only when the history upload succeeded (or was not needed,
      # as for a held run): a snapshot ahead of the Parquet history would lose the
      # versions closed in this run.
      - name: Commit data
        id: commit
        if: >-
          always() && steps.run.outputs.code != '' &&
          (steps.upload.outcome == 'success' || steps.upload.outcome == 'skipped')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md assets/*.svg
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          run_line="$(tail -n 1 data/runs.jsonl)"
          run_id="$(printf '%s' "$run_line" | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')"
          status="$(printf '%s' "$run_line" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          git commit -m "data: run $run_id ($status)"
          # On a conflict the run's own files win (-X theirs replays this commit's
          # side): data/ is written only by runs, and the README and visuals are
          # regenerated by every run anyway (INC-006).
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2> /dev/null || true
            sleep $((2 ** i))
          done
          exit 1

      - name: Alert on failed or held run
        id: alert
        if: always()
        run: |
          uv run --no-dev python -m pricemon.alert --data data --code "${{ steps.run.outputs.code }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out alert.md || printf 'Alert script failed; see the workflow run.\n' > alert.md
          for step in "upload:${{ steps.upload.outcome }}" "commit:${{ steps.commit.outcome }}"; do
            case "$step" in
              *:failure|commit:skipped)
                if [ "$step" = "commit:skipped" ] && [ "${{ steps.run.outputs.code }}" = "" ]; then
                  continue
                fi
                printf '\nStep `%s` did not complete; data was not committed.\n' "${step%%:*}" >> alert.md
                ;;
            esac
          done
          if [ ! -f alert.md ]; then
            exit 0
          fi
          echo "raised=true" >> "$GITHUB_OUTPUT"
          gh label create run-alert --color D98E14 --description "Daily run failed or held" --force
          number="$(gh issue list --label run-alert --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file alert.md
          else
            gh issue create --title "Daily run needs attention" --label run-alert --body-file alert.md
          fi

      - name: Fail the job when an alert was raised
        if: always() && steps.alert.outputs.raised == 'true'
        run: |
          echo "::error::daily run failed or was held, see the run-alert issue"
          exit 1

  # Publishes site/ to GitHub Pages. Off until the repository variable PAGES_ENABLED
  # is "true" and Settings, Pages, Source is "GitHub Actions" (D-026). A held run is
  # deployed too: the dashboard then shows the held status with the last good data.
  pages:
    needs: run
    # Pages deploys from main only (the github-pages environment): a branch run skips it (INC-011).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' && needs.run.outputs.pages == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the dashboard
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
