# Daily price, discount and stock run. Schedules run on the default branch.
# Keep the cron lines identical to CRONS in src/pricemon/schedule.py (tested).
name: daily

on:
  schedule:
    - cron: "17 6 * * *"          # every day
    - cron: "17 18 26-30 11 *"    # BFCM second run, 26-30 Nov
    - cron: "17 18 1 12 *"        # BFCM second run, 1 Dec
    - cron: "17 0,12 26-30 11 *"  # BFCM extra runs, only with BFCM_RUNS_PER_DAY "4"
    - cron: "17 0,12 1 12 *"      # BFCM extra runs, only with BFCM_RUNS_PER_DAY "4"
  workflow_dispatch:

env:
  # Black Friday / Cyber Monday (26 Nov to 1 Dec 2026): "4" runs a day only if the
  # repository is public by 26 Nov, otherwise "2" (06:17 and 18:17 UTC). D-021.
  BFCM_RUNS_PER_DAY: "2"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # Only the two extra BFCM slots pass through this gate; every other trigger skips it
  # (a skipped job costs no Actions minutes).
  slot:
    if: github.event.schedule == '17 0,12 26-30 11 *' || github.event.schedule == '17 0,12 1 12 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Extra BFCM slot runs only with BFCM_RUNS_PER_DAY "4"
        id: decide
        run: |
          if [ "$BFCM_RUNS_PER_DAY" = "4" ]; then run=true; else run=false; fi
          echo "BFCM_RUNS_PER_DAY=$BFCM_RUNS_PER_DAY, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  run:
    needs: slot
    if: ${{ !cancelled() && (needs.slot.result == 'skipped' || needs.slot.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    # Owner limit: one daily run under 45 minutes on a single runner (D-020).
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Download this month's history
        run: |
          month="$(date -u +%Y-%m)"
          echo "MONTH=$month" >> "$GITHUB_ENV"
          echo "TAG=data-$month" >> "$GITHUB_ENV"
          mkdir -p work
          # A month file that exists must be downloaded: merging without it would drop
          # the month's earlier closed versions. A missing file (new month, or a first
          # upload that failed) is fine: the run starts the month file from the snapshot.
          assets="$(gh release view "data-$month" --json assets --jq '.assets[].name' 2> /dev/null || true)"
          if printf '%s\n' "$assets" | grep -qx "price_history_$month.parquet"; then
            gh release download "data-$month" -p "price_history_$month.parquet" -D work
          fi
          ls -la work

      - name: Run pipeline
        id: run
        timeout-minutes: 41
        run: |
          set +e
          args=(--stores config/stores.yml --data data --history-out "work/price_history_$MONTH.parquet")
          if [ -f "work/price_history_$MONTH.parquet" ]; then
            args+=(--history-in "work/price_history_$MONTH.parquet")
          fi
          uv run --no-dev python -m pricemon.run "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code $code"

      - name: Upload history to release
        id: upload
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '2'
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Price history $MONTH" --latest=false \
              --notes "Monthly SCD2 price history (Parquet). Rewritten by every good run in $MONTH."
          fi
          gh release upload "$TAG" "work/price_history_$MONTH.parquet" --clobber

      - name: Publish Google Sheet
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '2'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        continue-on-error: true
        run: uv run --no-dev python -m pricemon.sheets --data data

      - name: Build dashboard
        if: always() && steps.run.outputs.code != ''
        run: uv run --no-dev python -m pricemon.site --data data --stores config/stores.yml --out site

      - name: Keep the dashboard as a run artifact
        if: always() && steps.run.outputs.code != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 14

      # Data is committed only when the history upload succeeded (or was not needed,
      # as for a held run): a snapshot ahead of the Parquet history would lose the
      # versions closed in this run.
      - name: Commit data
        id: commit
        if: >-
          always() && steps.run.outputs.code != '' &&
          (steps.upload.outcome == 'success' || steps.upload.outcome == 'skipped')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          run_line="$(tail -n 1 data/runs.jsonl)"
          run_id="$(printf '%s' "$run_line" | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')"
          status="$(printf '%s' "$run_line" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          git commit -m "data: run $run_id ($status)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          exit 1

      - name: Alert on failed or held run
        id: alert
        if: always()
        run: |
          uv run --no-dev python -m pricemon.alert --data data --code "${{ steps.run.outputs.code }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out alert.md || printf 'Alert script failed; see the workflow run.\n' > alert.md
          for step in "upload:${{ steps.upload.outcome }}" "commit:${{ steps.commit.outcome }}"; do
            case "$step" in
              *:failure|commit:skipped)
                if [ "$step" = "commit:skipped" ] && [ "${{ steps.run.outputs.code }}" = "" ]; then
                  continue
                fi
                printf '\nStep `%s` did not complete; data was not committed.\n' "${step%%:*}" >> alert.md
                ;;
            esac
          done
          if [ ! -f alert.md ]; then
            exit 0
          fi
          echo "raised=true" >> "$GITHUB_OUTPUT"
          gh label create run-alert --color E9A93C --description "Daily run failed or held" --force
          number="$(gh issue list --label run-alert --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file alert.md
          else
            gh issue create --title "Daily run needs attention" --label run-alert --body-file alert.md
          fi

      - name: Fail the job when an alert was raised
        if: always() && steps.alert.outputs.raised == 'true'
        run: |
          echo "::error::daily run failed or was held, see the run-alert issue"
          exit 1
