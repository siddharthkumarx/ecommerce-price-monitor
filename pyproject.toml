[project]
name = "ecommerce-price-monitor"
version = "0.1.0"
description = "Daily price, discount and stock monitor for US direct-to-consumer brands on Shopify."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "protego>=0.7.0,<0.8",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<0.18",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pricemon"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["protego"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
