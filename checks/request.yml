# Live check request. Pushing a change to this file runs .github/workflows/checks.yml
# on the GitHub runner; results are committed to checks/results/<id>/.
# pipeline-001: full dry run of the daily pipeline over config/stores.yml at the daily
# pace (D-005), writing into checks/results/pipeline-001/data only.
id: pipeline-001
check: pipeline
stores: config/stores.yml
concurrency: 3
delay_s: 4.0
jitter_s: 3.0
edge_interval_s: 3.0
edge_jitter_s: 1.5
