# Live check request. Pushing a change to this file runs .github/workflows/checks.yml
# on the GitHub runner; results are committed to checks/results/<id>/.
# terms-001: re-read the Terms of every listed store once with the fail-closed
# classifier and the full page search (D-040, D-043). Robots.txt and the Terms
# pages only, no catalog request; same pace as recon-009.
id: terms-001
check: terms
stores: config/stores.yml
concurrency: 4
delay_s: 5.0
jitter_s: 3.0
edge_interval_s: 4.0
edge_jitter_s: 2.0
