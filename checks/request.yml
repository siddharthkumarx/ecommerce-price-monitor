# Live check request. Pushing a change to this file runs .github/workflows/checks.yml
# on the GitHub runner; results are committed to checks/results/<id>/.
# pipeline-004: tests whether Shopify throttles per shop. Requests to the same shop are
# spaced 20 s + 0-10 s (was 4 s + 0-3 s); 8 shops in flight; the run-wide pace and the
# run-wide 429 cooldown are unchanged. The request log records every attempt with its time.
id: pipeline-004
check: pipeline
stores: config/stores.yml
concurrency: 8
delay_s: 20.0
